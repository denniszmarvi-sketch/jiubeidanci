<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="就背单词">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>就背单词</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--tx:#1c1c1e;--tx2:#8e8e93;--sep:#e5e5ea;--blue:#007aff;--green:#34c759;--red:#ff3b30;--fill:#e9e9ee}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--tx:#fff;--tx2:#98989f;--sep:#38383a;--blue:#0a84ff;--green:#30d158;--red:#ff453a;--fill:#2c2c2e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);-webkit-user-select:none;user-select:none}
#app{max-width:560px;margin:0 auto;padding:12px 16px 40px}
button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1{font-size:34px;letter-spacing:-.5px;margin:16px 0 12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:999px;padding:8px 14px;background:var(--fill);color:var(--tx);font-size:15px}.chip.on{background:var(--blue);color:#fff}
.card{background:var(--card);border-radius:20px;padding:20px;margin-bottom:16px}
.stats{display:flex;text-align:center;color:var(--tx2);font-size:13px}.stats div{flex:1}.stats b{display:block;font-size:32px;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--fill);margin-top:16px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);transition:width .3s}
.list{background:var(--card);border-radius:14px;margin-bottom:16px;overflow:hidden}
.list button{display:flex;justify-content:space-between;width:100%;border:0;background:none;color:var(--blue);padding:14px 16px;min-height:48px;text-align:left;border-bottom:.5px solid var(--sep)}.list button:last-child{border:0}.list button:active{background:var(--fill)}.list button:disabled{opacity:.4}.list span{color:var(--tx2)}.list .red{color:var(--red)}
.foot{text-align:center;color:var(--tx2);font-size:13px}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--tx2);margin-bottom:8px}.top button{border:0;background:none;color:var(--blue);padding:8px 0}
.q{text-align:center;padding:40px 20px;margin:20px 0 16px}.q small{color:var(--tx2)}.q h2{font-size:38px;margin:8px 0 0;word-break:break-word;letter-spacing:-.5px}
.opt{display:block;width:100%;border:0;border-radius:14px;background:var(--card);color:var(--tx);padding:15px 16px;margin-bottom:10px;text-align:left;min-height:52px}.opt:active{background:var(--fill)}.opt.ok{background:var(--green);color:#fff}.opt.bad{background:var(--red);color:#fff}
.skip{display:block;margin:8px auto;border:0;background:none;color:var(--tx2);padding:12px}
.primary{display:block;width:100%;border:0;border-radius:14px;background:var(--blue);color:#fff;font-weight:600;padding:15px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(60,60,67,.92);color:#fff;padding:10px 16px;border-radius:14px;font-size:15px;max-width:90%}
</style></head><body>
<div id="app"></div>
<input id="f" type="file" accept=".csv,.txt,.json,text/*" hidden>
<script src="data.js"></script>
<script>
const K='jbdc.v2',$=s=>document.querySelector(s),app=$('#app');
let S={st:{},extra:[],sess:null,pack:'all'};
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('存储空间不足，请先备份')}};
const TAGS={all:'全部',wk:'考研词汇',pk:'考研词组',w4:'四级词汇',w6:'六级词汇',p4:'四级词组',p6:'六级词组'},BITS={w4:1,w6:2,wk:4,p4:16,p6:32,pk:64};
const bank=()=>[...new Map([...(window.WORDS||[]),...S.extra].map(x=>[x[0].toLowerCase(),x])).values()];
const items=()=>bank().filter(x=>S.pack=='all'||x[2]&BITS[S.pack]);
const shuf=a=>{a=[...a];for(let i=a.length;i>1;){const j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const cnt=it=>{const k=it.filter(x=>S.st[x[0]]=='k').length,u=it.filter(x=>S.st[x[0]]=='u').length;return[k,u,it.length-k-u]};
let view='home',cur=null,locked=false;
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2200)}
function home(){view='home';const it=items(),[k,u,n]=cnt(it),t=it.length||1;
app.innerHTML=`<h1>就背单词</h1>
<div class=chips>${Object.entries(TAGS).map(([a,b])=>`<button class="chip ${S.pack==a?'on':''}" data-p=${a}>${b}</button>`).join('')}</div>
<div class=card><div class=stats><div><b style="color:var(--green)">${k}</b>已会</div><div><b style="color:var(--red)">${u}</b>不会</div><div><b>${n}</b>未测</div></div><div class=bar><i style="width:${(k+u)/t*100}%"></i></div></div>
<div class=list>${S.sess?`<button data-a=resume>继续上次筛查<span>${S.sess.i} / ${S.sess.q.length}</span></button>`:''}
<button data-a=new ${n?'':'disabled'}>开始筛查<span>${n} 个未测</span></button>
<button data-a=re ${u?'':'disabled'}>只复筛不会的词<span>${u} 个</span></button></div>
<div class=list><button data-a=exp>导出不会的词（CSV 表格）</button><button data-a=copy>复制为表格</button></div>
<div class=list><button data-a=imp>导入词库 / 恢复备份</button><button data-a=bak>备份进度</button><button data-a=rst class=red>重置进度</button></div>
<p class=foot>词库 ${bank().length} 条 · 进度自动保存在本机 · 可离线使用</p>`}
function start(m){const q=shuf(items().filter(x=>m=='re'?S.st[x[0]]=='u':!S.st[x[0]])).map(x=>x[0]);if(!q.length)return;S.sess={m,q,i:0};save();quiz()}
function quiz(){view='quiz';locked=false;const s=S.sess;if(!s||s.i>=s.q.length)return done();
const B=bank(),c=B.find(x=>x[0]==s.q[s.i]);if(!c){s.i++;return quiz()}
const ph=c[2]>=16,sp=m=>m.split(/[；;，,]/),sg=new Set(sp(c[1])),ds=shuf([...new Set(B.filter(x=>x[0]!=c[0]&&(x[2]>=16)==ph&&!sp(x[1]).some(t=>sg.has(t))).map(x=>x[1]))]).slice(0,3);
cur={c,o:shuf([c[1],...ds])};
app.innerHTML=`<div class=top><button data-a=exit>‹ 返回</button><span>${s.i+1} / ${s.q.length}</span></div><div class=bar><i style="width:${s.i/s.q.length*100}%"></i></div>
<div class="card q"><small>${ph?'词组':'词汇'}${s.m=='re'?'（复筛）':''}</small><h2>${c[0]}</h2></div>
${cur.o.map((o,i)=>`<button class=opt data-o=${i}>${o}</button>`).join('')}
<button class=skip data-a=dk>不认识</button><div id=nx></div>`}
function ans(i){if(locked)return;locked=true;const ok=i>=0&&cur.o[i]==cur.c[1];S.st[cur.c[0]]=ok?'k':'u';S.sess.i++;save();
document.querySelectorAll('.opt').forEach((b,j)=>{if(cur.o[j]==cur.c[1])b.classList.add('ok');else if(j==i)b.classList.add('bad')});
if(ok)setTimeout(()=>view=='quiz'&&quiz(),550);else $('#nx').innerHTML='<button class=primary data-a=next>继续</button>'}
function done(){view='done';S.sess=null;save();const[k,u]=cnt(items());
app.innerHTML=`<div class=card style="text-align:center;margin-top:20vh"><h2>本轮完成</h2><p>已会 ${k} 个，不会 ${u} 个</p></div><button class=primary data-a=home>返回首页</button>`}
const rows=()=>bank().filter(x=>S.st[x[0]]=='u'),q=s=>'"'+s.replace(/"/g,'""')+'"';
async function out(f){if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return}catch(e){if(e.name=='AbortError')return}}const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()}
function exp(){const r=rows();if(!r.length)return toast('还没有不会的词');out(new File(['\ufeff词汇,汉译\n'+r.map(x=>q(x[0])+','+q(x[1])).join('\n')],'不会的单词.csv',{type:'text/csv'}))}
function cp(){const r=rows();if(!r.length)return toast('还没有不会的词');navigator.clipboard.writeText('词汇\t汉译\n'+r.map(x=>x[0]+'\t'+x[1]).join('\n')).then(()=>toast('已复制，可粘贴到备忘录或 Numbers'))}
function bak(){out(new File([JSON.stringify({st:S.st,extra:S.extra})],'就背单词备份.json',{type:'application/json'}))}
$('#f').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const t=await f.text();
if(/\.json$/i.test(f.name)){try{const d=JSON.parse(t);S.st=d.st||{};S.extra=d.extra||[];save();toast('已恢复');home()}catch(_){toast('备份文件无效')}return}
const base=S.pack=='all'?'wk':S.pack,seen=new Set(S.extra.map(x=>x[0]));let n=0;
t.replace(/^\ufeff/,'').split(/\r?\n/).forEach(l=>{const m=l.match(/^"?([^,\t"]+?)"?[,\t]\s*"?(.+?)"?(?:[,\t](w4|w6|wk|p4|p6|pk))?\s*$/);if(!m||/^(词汇|word)$/i.test(m[1])||seen.has(m[1]))return;
const w=m[1].trim();let g=BITS[m[3]||base];if(!m[3]&&/ /.test(w)&&g<16)g<<=4;S.extra.push([w,m[2].trim(),g]);seen.add(w);n++});
save();toast(`已导入 ${n} 条`);home()};
app.onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;
if(d.p){S.pack=d.p;save();home()}else if(d.o!=null)ans(+d.o);else switch(d.a){case'new':start('new');break;case're':start('re');break;case'resume':quiz();break;case'dk':ans(-1);break;case'next':quiz();break;case'exit':case'home':home();break;case'exp':exp();break;case'copy':cp();break;case'imp':$('#f').click();break;case'bak':bak();break;case'rst':if(confirm('清空所有已会/不会记录？词库保留。')){S.st={};S.sess=null;save();home()}}};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
home();
</script></body></html>
